$kind: http-request
url: "{{baseURL}}/patient/{{invalidPatientId}}"
method: PUT
body:
  type: formdata
  content:
    - type: text
      key: patientInfo
      value: '	{"FirstName": "{{firstName}}", "LastName": "{{lastName}}", "ContactNumber": "{{contactNumber}}", "Email": "{{email}}", "Allergy": "{{allergy}}", "FoodPreference": "{{foodPreference}}", "CuisineCategory": "{{cuisineCategory}}", "DateOfBirth": "{{dateOfBirth}}"}'
    - type: file
      key: file
      src: []
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{dieticianToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("invalidPatientId", 999999);
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Invalid Patient ID - Status 404\", function () {\r

      \r

      \    pm.response.to.have.status(404);\r

      \r

      });"
    language: text/javascript
order: 7000
