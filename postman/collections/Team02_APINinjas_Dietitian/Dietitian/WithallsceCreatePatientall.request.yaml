      \        lastName: \"Smithe\",\r

      \        contactNumber: \"9584344236\",\r

      \        email: \"missingfirstname@gmail.com\",\r

      \        allergy: \"MILK\",\r

      \        foodPreference: \"VEGAN\",\r

      \        cuisineCategory: \"Indian\",\r

      \        dateOfBirth: \"1978-04-14\",\r

      \        expectedStatus: 400\r

      \    },\r

      \r

      \    {\r

      \        scenario: \"Missing last name\",\r

      \        firstName: \"John\",\r

      \        lastName: \"\",\r

      \        contactNumber: \"9584344237\",\r

      \        email: \"missinglastname@gmail.com\",\r

      \        allergy: \"MILK\",\r

      \        foodPreference: \"VEGAN\",\r

      \        cuisineCategory: \"Indian\",\r

      \        dateOfBirth: \"1978-04-15\",\r

      \        expectedStatus: 400\r

      \    },\r

      \r

      \    {\r

      \        scenario: \"Missing email\",\r

      \        firstName: \"John\",\r

