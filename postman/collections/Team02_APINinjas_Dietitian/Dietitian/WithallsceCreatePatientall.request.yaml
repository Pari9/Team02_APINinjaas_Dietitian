$kind: http-request
url: "{{baseURL}}/patient"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: patientInfo
      value: '	{"FirstName": "{{firstName}}", "LastName": "{{lastName}}", "ContactNumber": "{{contactNumber}}", "Email": "{{email}}", "Allergy": "{{allergy}}", "FoodPreference": "{{foodPreference}}", "CuisineCategory": "{{cuisineCategory}}", "DateOfBirth": "{{dateOfBirth}}"}'
    - type: file
      key: file
      src: []
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{dieticianToken}}"
scripts:
  - type: beforeRequest
    code: "// Retrieve testIndex\r

      \r

      let testIndex = Number(\r

      \    pm.collectionVariables.get(\"testIndex\")\r

      );\r

      \r

      if (isNaN(testIndex) || testIndex < 0) {\r

      \    testIndex = 0;\r

      }\r

      \r

      \r

      // Test dataset\r

      \r

      const testCases = [\r

      \r

      \    {\r

