      \        email: \"invalidcontact@gmail.com\",\r

      \        allergy: \"MILK\",\r

      \        foodPreference: \"VEGAN\",\r

      \        cuisineCategory: \"Indian\",\r

      \        dateOfBirth: \"1978-04-17\",\r

      \        expectedStatus: 400\r

      \    },\r

      \r

      \    {\r

      \        scenario: \"Missing contact number\",\r

      \        firstName: \"John\",\r

      \        lastName: \"Smith\",\r

      \        contactNumber: \"\",\r

      \        email: \"missingcontact@gmail.com\",\r

      \        allergy: \"MILK\",\r

