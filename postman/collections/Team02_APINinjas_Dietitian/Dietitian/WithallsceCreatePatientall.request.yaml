      \        contactNumber: \"9584344238\",\r

      \        email: \"\",\r

      \        allergy: \"MILK\",\r

      \        foodPreference: \"VEGAN\",\r

      \        cuisineCategory: \"Indian\",\r

      \        dateOfBirth: \"1978-04-16\",\r

      \        expectedStatus: 400\r

      \    },\r

      \r

      \    {\r

      \        scenario: \"Invalid contact number\",\r

      \        firstName: \"John\",\r

