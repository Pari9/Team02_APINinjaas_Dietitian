      \        foodPreference: \"VEGAN\",\r

      \        cuisineCategory: \"Indian\",\r

      \        dateOfBirth: \"\",\r

      \        expectedStatus: 400\r

      \    }\r

      \r

      ];\r

      \r

      \r

      // Extract current test case\r

      \r

      const currentTest = testCases[testIndex];\r

      \r

      if (currentTest) {\r

      \r

      \    pm.variables.set(\r

      \        \"currentScenario\",\r

      \        currentTest.scenario\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"firstName\",\r

      \        currentTest.firstName\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"lastName\",\r

      \        currentTest.lastName\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"contactNumber\",\r

      \        currentTest.contactNumber\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"email\",\r

      \        currentTest.email\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"allergy\",\r

      \        currentTest.allergy\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"foodPreference\",\r

      \        currentTest.foodPreference\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"cuisineCategory\",\r

      \        currentTest.cuisineCategory\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"dateOfBirth\",\r

      \        currentTest.dateOfBirth\r

      \    );\r

      \r

      \    pm.variables.set(\r

      \        \"currentExpectedStatus\",\r

      \        currentTest.expectedStatus\r

      \    );\r

      \r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const scenario = pm.variables.get(\r

      \    \"currentScenario\"\r

      );\r

      \r

      const expectedStatus = Number(\r

      \    pm.variables.get(\"currentExpectedStatus\")\r

      );\r

      \r

      pm.test(\r

      \    scenario + \" - Status Code is \" + expectedStatus,\r

      \    function () {\r

      \r

      \        pm.expect(\r

      \            pm.response.code\r

      \        ).to.eql(expectedStatus);\r

      \r

      \    }\r

      );\r

      \r

      \r

      // Save Patient ID only for successful creation\r

      \r

      if (pm.response.code === 201) {\r

      \r

      \    const response = pm.response.json();\r

      \r

      \    pm.collectionVariables.set(\r

      \        \"envPatientId\",\r

      \        response.patientId\r

      \    );\r

      \r

      \    console.log(\r

      \        \"Created Patient ID:\",\r

      \        response.patientId\r

      \    );\r

      }\r

      \r

      \r

      // Move to next test case\r

      \r

      let testIndex = Number(\r

      \    pm.collectionVariables.get(\"testIndex\")\r

      );\r

      \r

      if (isNaN(testIndex)) {\r

      \    testIndex = 0;\r

      }\r

      \r

      pm.collectionVariables.set(\r

      \    \"testIndex\",\r

      \    testIndex + 1\r

      );"
    language: text/javascript
order: 4000
